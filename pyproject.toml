[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-reading"
version = "0.3.1"
description = "Conversation-driven reading reports as native Zotero notes"
readme = "docs/PUBLIC_README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4,<7"]

[project.scripts]
zotero-reading = "zotero_notes:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["zotero_notes", "reading_sessions", "bootstrap", "paper_materials"]
